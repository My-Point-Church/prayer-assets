<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Point Church Prayer Review</title><style>body{margin:0;background:#f5f7fa;color:#1f2937;font:16px Arial,sans-serif}main{max-width:680px;margin:0 auto;padding:64px 20px;text-align:center}h1{color:#123d6a}.panel{background:#fff;border:1px solid #d8dee8;border-radius:10px;padding:32px;box-shadow:0 2px 8px #0000000d}.spinner{width:34px;height:34px;margin:22px auto;border:4px solid #dbe5ef;border-top-color:#1769aa;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}</style></head><body><main><div class="panel"><h1>Opening prayer review…</h1><div class="spinner" aria-hidden="true"></div><p id="status">Verifying the secure review link.</p></div></main><form id="handoff" method="post" action="https://script.google.com/macros/s/AKfycbzcseotwFa4GI9Vcrln_ycBz9BllTdnBeqf18sjie2eRBBpY0ILT9jGlMKqovH6zUa7lw/exec" hidden><input type="hidden" name="mode" value="open"><input type="hidden" name="draft"><input type="hidden" name="exp"><input type="hidden" name="sig"></form><script>(function(){var q=new URLSearchParams(location.search),f=document.getElementById("handoff"),r=["draft","exp","sig"];if(r.some(function(k){return !q.get(k)})){document.getElementById("status").textContent="This review link is incomplete. Please use the link from the review email.";document.querySelector(".spinner").hidden=true;return}r.forEach(function(k){f.elements[k].value=q.get(k)});f.submit()}());</script></body></html>
